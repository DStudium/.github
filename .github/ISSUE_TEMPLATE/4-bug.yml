name: Bug
description: Что-то работает не так, как описано в стори
type: Bug
projects: ["DStudium/2"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Где
      multiple: true
      options:
        - Android
        - iOS
        - Desktop
        - Backend
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения или коммит
  - type: textarea
    id: logs
    attributes:
      label: Скриншоты, логи
      description: Логи вставляй целиком, они оформятся блоком кода.
      render: shell
